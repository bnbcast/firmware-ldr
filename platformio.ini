; PlatformIO Project Configuration File
; ESP32 Solar-Tracker Sensor Rig (Bring-up & Diagnostics)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

; Exact pinned library versions from PlatformIO registry
lib_deps =
    adafruit/RTClib @ 2.1.4
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8

build_flags =
    -Wall
    -Wextra
    -Werror=return-type

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -DUNIT_TEST_NATIVE
; Do not pull Arduino-specific libraries into native unit tests
lib_ignore =
    RTClib
    Adafruit BusIO
    PubSubClient
    Wire
    SPI
